<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Desenha Comigo! 🎨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Bowlby+One&display=swap" rel="stylesheet">
<style>
  :root {
    --c-bg: #fff8e7;
    --c-ink: #2b1d0e;
    --c-primary: #ff5a36;
    --c-yellow: #ffd23f;
    --c-blue: #4ecdc4;
    --c-pink: #ff6b9d;
    --c-green: #95e06c;
    --c-purple: #a06cd5;
    --shadow: 4px 4px 0 var(--c-ink);
    --shadow-lg: 6px 6px 0 var(--c-ink);
  }

- { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
height: 100%;
overflow: hidden;
overscroll-behavior: none;
}

body {
font-family: ‘Fredoka’, system-ui, sans-serif;
background: var(–c-bg);
color: var(–c-ink);
background-image:
radial-gradient(circle at 20% 30%, rgba(255,210,63,0.15) 0%, transparent 50%),
radial-gradient(circle at 80% 70%, rgba(78,205,196,0.15) 0%, transparent 50%);
user-select: none;
-webkit-user-select: none;
touch-action: manipulation;
}

/* Decorative paper texture */
body::before {
content: ‘’;
position: fixed;
inset: 0;
background-image:
repeating-linear-gradient(45deg, transparent 0 30px, rgba(43,29,14,0.015) 30px 31px);
pointer-events: none;
z-index: 0;
}

.screen {
position: fixed;
inset: 0;
display: none;
flex-direction: column;
padding: 16px;
z-index: 1;
overflow-y: auto;
-webkit-overflow-scrolling: touch;
}
.screen.active { display: flex; }

/* ============ HOME SCREEN ============ */
.home-header {
text-align: center;
padding: 12px 0 20px;
}
.home-title {
font-family: ‘Bowlby One’, sans-serif;
font-size: clamp(2.2rem, 9vw, 3.5rem);
color: var(–c-primary);
line-height: 0.95;
text-shadow: 3px 3px 0 var(–c-ink);
letter-spacing: -1px;
transform: rotate(-2deg);
display: inline-block;
}
.home-subtitle {
font-size: clamp(0.95rem, 3.5vw, 1.1rem);
margin-top: 8px;
font-weight: 600;
color: var(–c-ink);
opacity: 0.75;
}
.home-emoji {
display: inline-block;
font-size: 1.4em;
animation: wiggle 2s ease-in-out infinite;
}
@keyframes wiggle {
0%, 100% { transform: rotate(-8deg); }
50% { transform: rotate(8deg); }
}

.drawings-grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 14px;
max-width: 500px;
margin: 0 auto;
width: 100%;
padding-bottom: 24px;
}

.drawing-card {
background: white;
border: 3px solid var(–c-ink);
border-radius: 18px;
padding: 12px 8px 10px;
box-shadow: var(–shadow);
cursor: pointer;
transition: transform 0.15s, box-shadow 0.15s;
aspect-ratio: 1;
display: flex;
flex-direction: column;
align-items: center;
justify-content: space-between;
position: relative;
overflow: hidden;
}
.drawing-card:active {
transform: translate(2px, 2px);
box-shadow: 2px 2px 0 var(–c-ink);
}
.drawing-card:nth-child(1) { background: #fff3a8; }
.drawing-card:nth-child(2) { background: #b8eed5; }
.drawing-card:nth-child(3) { background: #ffd0e2; }
.drawing-card:nth-child(4) { background: #c5d9ff; }
.drawing-card:nth-child(5) { background: #ffd9b3; }
.drawing-card:nth-child(6) { background: #d6c1ff; }

.drawing-card svg {
width: 92%;
height: 78%;
flex: 1;
display: block;
}
.drawing-card-name {
font-family: ‘Bowlby One’, sans-serif;
font-size: clamp(0.95rem, 4vw, 1.15rem);
text-transform: lowercase;
margin-top: 4px;
}

/* ============ DRAW SCREEN ============ */
.draw-header {
display: flex;
align-items: center;
gap: 10px;
margin-bottom: 12px;
}

.btn-back {
width: 48px;
height: 48px;
border-radius: 50%;
background: white;
border: 3px solid var(–c-ink);
box-shadow: var(–shadow);
font-size: 1.5rem;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
transition: transform 0.1s;
}
.btn-back:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(–c-ink); }

.draw-title {
font-family: ‘Bowlby One’, sans-serif;
font-size: clamp(1.3rem, 5vw, 1.7rem);
color: var(–c-ink);
text-transform: lowercase;
flex: 1;
}

.progress-bar {
background: white;
border: 3px solid var(–c-ink);
border-radius: 14px;
height: 22px;
overflow: hidden;
margin-bottom: 12px;
position: relative;
}
.progress-fill {
height: 100%;
background: linear-gradient(90deg, var(–c-primary), var(–c-yellow));
transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
border-right: 3px solid var(–c-ink);
}
.progress-text {
position: absolute;
inset: 0;
display: flex;
align-items: center;
justify-content: center;
font-weight: 700;
font-size: 0.85rem;
color: var(–c-ink);
}

.canvas-wrap {
background: white;
border: 3px solid var(–c-ink);
border-radius: 20px;
box-shadow: var(–shadow-lg);
flex: 1;
min-height: 0;
display: flex;
align-items: center;
justify-content: center;
padding: 12px;
position: relative;
overflow: hidden;
}
.canvas-wrap::before {
content: ‘’;
position: absolute;
inset: 8px;
border: 2px dashed rgba(43,29,14,0.12);
border-radius: 14px;
pointer-events: none;
}
#stepSvg {
width: 100%;
height: 100%;
max-width: 100%;
max-height: 100%;
}

.instruction {
background: var(–c-yellow);
border: 3px solid var(–c-ink);
border-radius: 16px;
padding: 12px 16px;
margin: 14px 0;
font-weight: 600;
font-size: clamp(0.95rem, 3.8vw, 1.1rem);
text-align: center;
box-shadow: var(–shadow);
line-height: 1.3;
}

.nav-buttons {
display: flex;
gap: 10px;
}
.btn {
flex: 1;
border: 3px solid var(–c-ink);
border-radius: 16px;
padding: 16px 12px;
font-family: ‘Bowlby One’, sans-serif;
font-size: clamp(1rem, 4vw, 1.2rem);
cursor: pointer;
box-shadow: var(–shadow);
transition: transform 0.1s, box-shadow 0.1s;
text-transform: lowercase;
background: white;
}
.btn:active:not(:disabled) {
transform: translate(2px, 2px);
box-shadow: 2px 2px 0 var(–c-ink);
}
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-primary { background: var(–c-primary); color: white; }
.btn-secondary { background: white; }
.btn-success { background: var(–c-green); }

/* ============ CAPTURE SCREEN ============ */
.capture-content {
flex: 1;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 18px;
text-align: center;
}
.capture-icon {
font-size: 5rem;
animation: bounce 1.5s ease-in-out infinite;
}
@keyframes bounce {
0%, 100% { transform: translateY(0); }
50% { transform: translateY(-10px); }
}
.capture-msg {
font-family: ‘Bowlby One’, sans-serif;
font-size: clamp(1.3rem, 5vw, 1.6rem);
color: var(–c-ink);
padding: 0 20px;
}
.capture-sub {
font-size: 1rem;
opacity: 0.7;
padding: 0 24px;
}
.capture-buttons {
display: flex;
flex-direction: column;
gap: 12px;
width: 100%;
max-width: 320px;
padding: 0 16px;
}

/* video preview */
#videoPreview {
width: 100%;
max-width: 420px;
border: 3px solid var(–c-ink);
border-radius: 18px;
background: black;
aspect-ratio: 4/3;
object-fit: cover;
box-shadow: var(–shadow-lg);
}

/* ============ RESULT SCREEN ============ */
.result-stage {
flex: 1;
background: linear-gradient(180deg, #c5e8ff 0%, #95e06c 100%);
border: 3px solid var(–c-ink);
border-radius: 20px;
box-shadow: var(–shadow-lg);
margin-bottom: 14px;
position: relative;
overflow: hidden;
min-height: 0;
}
.result-stage::after {
/* clouds */
content: ‘’;
position: absolute;
top: 10%;
left: 0;
right: 0;
height: 40px;
background:
radial-gradient(ellipse 60px 25px at 20% 50%, white 40%, transparent 41%),
radial-gradient(ellipse 50px 22px at 70% 50%, white 40%, transparent 41%);
opacity: 0.85;
animation: clouds 20s linear infinite;
}
@keyframes clouds {
from { transform: translateX(-30px); }
to { transform: translateX(30px); }
}
#resultImage {
position: absolute;
max-width: 70%;
max-height: 70%;
left: 50%;
top: 50%;
transform: translate(-50%, -50%);
z-index: 2;
filter: drop-shadow(3px 3px 6px rgba(0,0,0,0.2));
}

/* Animations per type */
#resultImage.anim-swim {
animation: swim 4s ease-in-out infinite;
}
@keyframes swim {
0%   { transform: translate(-150%, -50%) rotate(-5deg); }
25%  { transform: translate(-50%, -60%) rotate(5deg); }
50%  { transform: translate(50%, -50%) rotate(-5deg) scaleX(-1); }
75%  { transform: translate(-50%, -40%) rotate(5deg) scaleX(-1); }
100% { transform: translate(-150%, -50%) rotate(-5deg); }
}

#resultImage.anim-bounce {
animation: catBounce 1.2s ease-in-out infinite;
transform-origin: center bottom;
}
@keyframes catBounce {
0%, 100% { transform: translate(-50%, -50%) scale(1, 1); }
50%      { transform: translate(-50%, -60%) scale(0.95, 1.05); }
}

#resultImage.anim-sway {
animation: housesway 3s ease-in-out infinite;
transform-origin: center bottom;
}
@keyframes housesway {
0%, 100% { transform: translate(-50%, -50%) rotate(-2deg); }
50%      { transform: translate(-50%, -50%) rotate(2deg); }
}

#resultImage.anim-shake {
animation: milkshake 0.4s ease-in-out infinite;
transform-origin: center center;
}
@keyframes milkshake {
0%, 100% { transform: translate(-50%, -50%) rotate(-3deg); }
25%      { transform: translate(-48%, -50%) rotate(3deg); }
75%      { transform: translate(-52%, -50%) rotate(-3deg); }
}

#resultImage.anim-rainbow {
animation: rainbowPulse 2s ease-in-out infinite;
}
@keyframes rainbowPulse {
0%, 100% { transform: translate(-50%, -50%) scale(1); filter: drop-shadow(3px 3px 6px rgba(0,0,0,0.2)) hue-rotate(0deg); }
50%      { transform: translate(-50%, -50%) scale(1.08); filter: drop-shadow(3px 3px 12px rgba(255,200,100,0.6)) hue-rotate(20deg); }
}

#resultImage.anim-rocket {
animation: rocketUp 3s ease-in-out infinite;
}
@keyframes rocketUp {
0%   { transform: translate(-50%, 150%) rotate(-3deg); }
50%  { transform: translate(-50%, -50%) rotate(3deg); }
100% { transform: translate(-50%, -150%) rotate(-3deg); opacity: 0; }
}

/* sparkles overlay for result */
.sparkle {
position: absolute;
width: 20px;
height: 20px;
background: radial-gradient(circle, var(–c-yellow) 30%, transparent 31%);
animation: sparkle 1.5s ease-in-out infinite;
z-index: 3;
pointer-events: none;
}
@keyframes sparkle {
0%, 100% { opacity: 0; transform: scale(0.5); }
50% { opacity: 1; transform: scale(1.2); }
}

/* Confetti when finishing */
.confetti-piece {
position: fixed;
width: 12px;
height: 12px;
top: -20px;
z-index: 999;
pointer-events: none;
animation: confettiFall linear forwards;
}
@keyframes confettiFall {
to { transform: translateY(110vh) rotate(720deg); }
}

.result-actions {
display: flex;
gap: 10px;
}

/* Loading spinner */
.processing {
position: fixed;
inset: 0;
background: rgba(255,248,231,0.95);
display: none;
align-items: center;
justify-content: center;
z-index: 100;
flex-direction: column;
gap: 16px;
}
.processing.active { display: flex; }
.spinner {
width: 60px;
height: 60px;
border: 6px solid var(–c-yellow);
border-top-color: var(–c-primary);
border-radius: 50%;
animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Toast */
.toast {
position: fixed;
bottom: 30px;
left: 50%;
transform: translateX(-50%) translateY(150%);
background: var(–c-ink);
color: white;
padding: 14px 24px;
border-radius: 16px;
font-weight: 600;
z-index: 200;
transition: transform 0.3s;
text-align: center;
max-width: 90%;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* SVG step coloring */
.step-shape {
stroke: #2b1d0e;
stroke-width: 3;
stroke-linecap: round;
stroke-linejoin: round;
}
/* default fill is none unless an explicit fill attribute is set */
.step-shape:not([fill]) {
fill: none;
}
.step-shape.new {
stroke: #ff5a36;
stroke-width: 5;
animation: drawIn 0.5s ease-out;
}
@keyframes drawIn {
from { opacity: 0; transform: scale(0.8); transform-origin: center; }
to { opacity: 1; transform: scale(1); }
}
.step-shape.fill-y { fill: var(–c-yellow); }
.step-shape.fill-p { fill: var(–c-pink); }
.step-shape.fill-b { fill: var(–c-blue); }
.step-shape.fill-g { fill: var(–c-green); }
.step-shape.fill-w { fill: white; }
.step-shape.fill-r { fill: var(–c-primary); }
.step-shape.fill-u { fill: var(–c-purple); }
.step-shape.fill-brown { fill: #a0522d; }
</style>

</head>
<body>

<!-- ============ HOME SCREEN ============ -->

<div class="screen active" id="screenHome">
  <div class="home-header">
    <h1 class="home-title">desenha<br>comigo<span class="home-emoji">🎨</span></h1>
    <p class="home-subtitle">escolhe um desenho pra fazer!</p>
  </div>
  <div class="drawings-grid" id="drawingsGrid"></div>
</div>

<!-- ============ DRAW SCREEN ============ -->

<div class="screen" id="screenDraw">
  <div class="draw-header">
    <button class="btn-back" onclick="goHome()">←</button>
    <div class="draw-title" id="drawTitle">desenho</div>
  </div>
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
    <div class="progress-text" id="progressText">passo 1</div>
  </div>
  <div class="canvas-wrap">
    <svg id="stepSvg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
  <div class="instruction" id="instruction">vamos começar!</div>
  <div class="nav-buttons">
    <button class="btn btn-secondary" id="btnPrev" onclick="prevStep()">← voltar</button>
    <button class="btn btn-primary" id="btnNext" onclick="nextStep()">próximo →</button>
  </div>
</div>

<!-- ============ CAPTURE SCREEN ============ -->

<div class="screen" id="screenCapture">
  <div class="draw-header">
    <button class="btn-back" onclick="backToDraw()">←</button>
    <div class="draw-title">tirar foto</div>
  </div>
  <div class="capture-content" id="captureContent">
    <div class="capture-icon">📸</div>
    <div class="capture-msg">fotografa o seu desenho!</div>
    <div class="capture-sub">coloca o papel numa mesa com boa luz</div>
    <div class="capture-buttons">
      <button class="btn btn-primary" onclick="openCamera()">📷 usar câmera</button>
      <button class="btn btn-secondary" onclick="openGallery()">🖼️ escolher da galeria</button>
    </div>
  </div>
  <input type="file" id="fileInput" accept="image/*" style="display:none">
  <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
</div>

<!-- ============ CAMERA LIVE SCREEN ============ -->

<div class="screen" id="screenCameraLive">
  <div class="draw-header">
    <button class="btn-back" onclick="stopCamera()">←</button>
    <div class="draw-title">câmera</div>
  </div>
  <div style="flex:1; display:flex; align-items:center; justify-content:center; padding:10px 0;">
    <video id="videoPreview" autoplay playsinline muted></video>
  </div>
  <div class="nav-buttons">
    <button class="btn btn-primary" onclick="takePhoto()">📸 tirar foto!</button>
  </div>
  <canvas id="captureCanvas" style="display:none"></canvas>
</div>

<!-- ============ RESULT SCREEN ============ -->

<div class="screen" id="screenResult">
  <div class="draw-header">
    <button class="btn-back" onclick="goHome()">←</button>
    <div class="draw-title" id="resultTitle">olha só!</div>
  </div>
  <div class="result-stage" id="resultStage">
    <img id="resultImage" alt="seu desenho">
    <div class="sparkle" style="top:20%; left:15%; animation-delay:0s"></div>
    <div class="sparkle" style="top:30%; right:15%; animation-delay:0.3s"></div>
    <div class="sparkle" style="bottom:30%; left:25%; animation-delay:0.7s"></div>
    <div class="sparkle" style="bottom:25%; right:20%; animation-delay:1s"></div>
  </div>
  <div class="result-actions">
    <button class="btn btn-success" onclick="downloadResult()">💾 salvar</button>
    <button class="btn btn-primary" onclick="goHome()">🎨 outro!</button>
  </div>
</div>

<!-- Processing overlay -->

<div class="processing" id="processing">
  <div class="spinner"></div>
  <div style="font-weight:600">processando...</div>
</div>

<!-- Toast -->

<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   DRAWINGS DATA
   Each drawing = name, emoji, animation class, viewBox, and array of
   cumulative steps. Each step is an array of SVG shape strings.
   ===================================================================== */
const DRAWINGS = {
  peixe: {
    name: "peixe",
    emoji: "🐠",
    anim: "anim-swim",
    instructions: [
      "desenha um oval grande no meio do papel — esse é o corpo",
      "agora faz um triângulo do lado pra ser o rabinho",
      "põe um círculo pequeno pro olho",
      "desenha uma listra curva no meio do corpo",
      "faz uma barbatana em cima",
      "uma boquinha sorrindo na frente",
      "agora umas bolhinhas saindo da boca — pronto, terminou! 🎉"

      [`<ellipse class="step-shape" fill="#4ecdc4" cx="200" cy="200" rx="120" ry="70"/>`,

      // step 4: + stripe
      [`<ellipse class="step-shape" fill="#4ecdc4" cx="200" cy="200" rx="120" ry="70"/>`,
       `<polygon class="step-shape" fill="#4ecdc4" points="320,200 380,150 380,250"/>`,
       `<circle class="step-shape" fill="#ffffff" cx="140" cy="180" r="14"/>`,
       `<circle class="step-shape" cx="140" cy="180" r="6" fill="#2b1d0e"/>`,
       `<path class="step-shape new" d="M 220 140 Q 240 200 220 260" stroke-width="6"/>`],
      // step 5: + top fin
      [`<ellipse class="step-shape" fill="#4ecdc4" cx="200" cy="200" rx="120" ry="70"/>`,
       `<polygon class="step-shape" fill="#4ecdc4" points="320,200 380,150 380,250"/>`,
       `<circle class="step-shape" fill="#ffffff" cx="140" cy="180" r="14"/>`,
       `<circle class="step-shape" cx="140" cy="180" r="6" fill="#2b1d0e"/>`,
       `<path class="step-shape" d="M 220 140 Q 240 200 220 260" stroke-width="6"/>`,
       `<path class="step-shape new" fill="#4ecdc4" d="M 180 135 Q 200 90 240 135 Z"/>`],
      // step 6: + mouth
      [`<ellipse class="step-shape" fill="#4ecdc4" cx="200" cy="200" rx="120" ry="70"/>`,
       `<polygon class="step-shape" fill="#4ecdc4" points="320,200 380,150 380,250"/>`,
       `<circle class="step-shape" fill="#ffffff" cx="140" cy="180" r="14"/>`,
       `<circle class="step-shape" cx="140" cy="180" r="6" fill="#2b1d0e"/>`,
       `<path class="step-shape" d="M 220 140 Q 240 200 220 260" stroke-width="6"/>`,
       `<path class="step-shape" fill="#4ecdc4" d="M 180 135 Q 200 90 240 135 Z"/>`,
       `<path class="step-shape new" d="M 90 210 Q 100 230 90 240"/>`],
      // step 7: + bubbles
      [`<ellipse class="step-shape" fill="#4ecdc4" cx="200" cy="200" rx="120" ry="70"/>`,
       `<polygon class="step-shape" fill="#4ecdc4" points="320,200 380,150 380,250"/>`,
       `<circle class="step-shape" fill="#ffffff" cx="140" cy="180" r="14"/>`,
       `<circle class="step-shape" cx="140" cy="180" r="6" fill="#2b1d0e"/>`,
       `<path class="step-shape" d="M 220 140 Q 240 200 220 260" stroke-width="6"/>`,
       `<path class="step-shape" fill="#4ecdc4" d="M 180 135 Q 200 90 240 135 Z"/>`,
       `<path class="step-shape" d="M 90 210 Q 100 230 90 240"/>`,
       `<circle class="step-shape new" fill="#ffffff" cx="55" cy="190" r="10"/>`,
       `<circle class="step-shape new" fill="#ffffff" cx="35" cy="160" r="7"/>`,
       `<circle class="step-shape new" fill="#ffffff" cx="50" cy="130" r="5"/>`]
    ]
  },

  gato: {
    name: "gato",
    emoji: "🐱",
    anim: "anim-bounce",
    instructions: [
      "desenha um círculo grande pra cabeça",
      "põe dois triângulos em cima — as orelhinhas",
      "agora os olhos: dois círculos",
      "um triângulo pequeno pro narizinho",
      "a boca: duas curvinhas pra baixo",
      "põe os bigodes — três risquinhos de cada lado",
      "pronto, é um gato!! 🐈"

/* =====================================================================
   STATE
   ===================================================================== */
let currentDrawing = null;
let currentStep = 0;
let cameraStream = null;
let capturedImageDataUrl = null;

/* =====================================================================
   INIT
   ===================================================================== */
// Custom viewBox per drawing for the menu preview, so each fits its card nicely
const PREVIEW_VIEWBOX = {
  peixe:       "20 110 380 200",
  gato:        "60 90 280 230",
  casa:        "70 20 330 360",
  milkshake:   "100 30 200 350",
  "arco-iris": "20 150 360 220",
  foguete:     "30 30 320 320"
};

function init() {
  const grid = document.getElementById('drawingsGrid');
  Object.keys(DRAWINGS).forEach(key => {
    const d = DRAWINGS[key];
    const card = document.createElement('div');
    card.className = 'drawing-card';
    card.onclick = () => startDrawing(key);
    const previewSvg = d.steps[d.steps.length - 1].join('');
    const vb = PREVIEW_VIEWBOX[key] || "0 0 400 400";
    card.innerHTML = `
      <svg viewBox="${vb}" preserveAspectRatio="xMidYMid meet">${previewSvg}</svg>
      <div class="drawing-card-name">${d.name}</div>
    `;
    grid.appendChild(card);
  });
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goHome() {
  stopCamera();
  currentDrawing = null;
  currentStep = 0;
  showScreen('screenHome');
}

/* =====================================================================
   DRAW FLOW
   ===================================================================== */
function startDrawing(key) {
  currentDrawing = key;
  currentStep = 0;
  document.getElementById('drawTitle').textContent = DRAWINGS[key].name;
  renderStep();
  showScreen('screenDraw');
}

function renderStep() {
  const d = DRAWINGS[currentDrawing];
  const svg = document.getElementById('stepSvg');
  svg.innerHTML = d.steps[currentStep].join('');
  const total = d.steps.length;
  const pct = ((currentStep + 1) / total) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `passo ${currentStep + 1} de ${total}`;
  document.getElementById('instruction').textContent = d.instructions[currentStep] || '';

  document.getElementById('btnPrev').disabled = currentStep === 0;
  const btnNext = document.getElementById('btnNext');
  if (currentStep === total - 1) {
    btnNext.textContent = '📸 tirar foto!';
    btnNext.classList.remove('btn-primary');
    btnNext.classList.add('btn-success');
  } else {
    btnNext.textContent = 'próximo →';
    btnNext.classList.add('btn-primary');
    btnNext.classList.remove('btn-success');
  }
}

function nextStep() {
  const d = DRAWINGS[currentDrawing];
  if (currentStep < d.steps.length - 1) {
    currentStep++;
    renderStep();
  } else {
    // finished steps, go to capture
    fireConfetti();
    setTimeout(() => showScreen('screenCapture'), 600);
  }
}

function prevStep() {
  if (currentStep > 0) {
    currentStep--;
    renderStep();
  }
}

function backToDraw() {
  showScreen('screenDraw');
}

/* =====================================================================
   CAPTURE FLOW
   ===================================================================== */
async function openCamera() {
  // Try native getUserMedia first
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 960 } },
      audio: false
    });
    cameraStream = stream;
    const video = document.getElementById('videoPreview');
    video.srcObject = stream;
    showScreen('screenCameraLive');
  } catch (err) {
    console.warn('getUserMedia failed, falling back to capture input', err);
    // Fallback to native file input with capture attribute
    document.getElementById('cameraInput').click();
  }
}

function stopCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
  showScreen('screenCapture');
}

function takePhoto() {
  const video = document.getElementById('videoPreview');
  const canvas = document.getElementById('captureCanvas');
  canvas.width = video.videoWidth || 1280;
  canvas.height = video.videoHeight || 960;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  const dataUrl = canvas.toDataURL('image/png');
  if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
  processImage(dataUrl);
}

function openGallery() {
  document.getElementById('fileInput').click();
}

document.getElementById('fileInput').addEventListener('change', handleFile);
document.getElementById('cameraInput').addEventListener('change', handleFile);

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => processImage(ev.target.result);
  reader.readAsDataURL(file);
  e.target.value = ''; // reset so re-selecting same file works
}

/* =====================================================================
   IMAGE PROCESSING — remove white/light background
   ===================================================================== */
function processImage(dataUrl) {
  showProcessing(true);
  const img = new Image();
  img.onload = () => {
    try {
      const processed = removeBackground(img);
      capturedImageDataUrl = processed;
      showProcessing(false);
      showResult();
    } catch (err) {
      console.error(err);
      // fallback: use original
      capturedImageDataUrl = dataUrl;
      showProcessing(false);
      showResult();
      toast('não consegui tirar o fundo, mas tá tudo bem!');
    }
  };
  img.onerror = () => {
    showProcessing(false);
    toast('ops, não consegui ler a imagem');
  };
  img.src = dataUrl;
}

function removeBackground(img) {
  // Downscale large images for performance
  const MAX = 1000;
  let w = img.width, h = img.height;
  if (w > MAX || h > MAX) {
    const r = Math.min(MAX / w, MAX / h);
    w = Math.round(w * r);
    h = Math.round(h * r);
  }
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, w, h);
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;

  // Threshold: pixels close to white become transparent
  // Lightness threshold ~ 215. Tune if needed.
  const T = 210;
  for (let i = 0; i < data.length; i += 4) {
    const r = data[i], g = data[i+1], b = data[i+2];
    // average brightness
    const lum = (r * 0.299 + g * 0.587 + b * 0.114);
    if (lum > T) {
      data[i+3] = 0; // make transparent
    } else if (lum > T - 30) {
      // soft edge: partial transparency
      const alpha = ((T - lum) / 30) * 255;
      data[i+3] = Math.max(0, Math.min(255, alpha));
    }
  }
  ctx.putImageData(imgData, 0, 0);

  // Crop to non-transparent bounds for tighter framing
  return cropToContent(canvas);
}

function cropToContent(canvas) {
  const ctx = canvas.getContext('2d');
  const { width: w, height: h } = canvas;
  const data = ctx.getImageData(0, 0, w, h).data;
  let minX = w, minY = h, maxX = 0, maxY = 0;
  let found = false;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const alpha = data[(y * w + x) * 4 + 3];
      if (alpha > 20) {
        if (x < minX) minX = x;
        if (y < minY) minY = y;
        if (x > maxX) maxX = x;
        if (y > maxY) maxY = y;
        found = true;
      }
    }
  }
  if (!found) return canvas.toDataURL('image/png');
  const padding = 10;
  minX = Math.max(0, minX - padding);
  minY = Math.max(0, minY - padding);
  maxX = Math.min(w - 1, maxX + padding);
  maxY = Math.min(h - 1, maxY + padding);
  const cw = maxX - minX + 1;
  const ch = maxY - minY + 1;
  const out = document.createElement('canvas');
  out.width = cw; out.height = ch;
  out.getContext('2d').drawImage(canvas, minX, minY, cw, ch, 0, 0, cw, ch);
  return out.toDataURL('image/png');
}

/* =====================================================================
   RESULT SCREEN
   ===================================================================== */
function showResult() {
  const d = DRAWINGS[currentDrawing];
  const img = document.getElementById('resultImage');
  img.src = capturedImageDataUrl;
  // Reset animation classes
  img.className = '';
  // Force reflow then add class
  void img.offsetWidth;
  img.classList.add(d.anim);
  document.getElementById('resultTitle').textContent = `seu ${d.name}!`;
  showScreen('screenResult');
  fireConfetti();
}

function downloadResult() {
  if (!capturedImageDataUrl) return;
  const a = document.createElement('a');
  a.href = capturedImageDataUrl;
  a.download = `meu-${DRAWINGS[currentDrawing].name}.png`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  toast('foto salva! 🎉');
}

/* =====================================================================
   UTILITIES
   ===================================================================== */
function showProcessing(on) {
  document.getElementById('processing').classList.toggle('active', on);
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2400);
}

function fireConfetti() {
  const colors = ['#ff5a36', '#ffd23f', '#4ecdc4', '#ff6b9d', '#95e06c', '#a06cd5'];
  for (let i = 0; i < 40; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
    piece.style.animationDelay = Math.random() * 0.5 + 's';
    if (Math.random() > 0.5) piece.style.borderRadius = '50%';
    piece.style.transform = `rotate(${Math.random() * 360}deg)`;
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 3500);
  }
}

// Prevent pull-to-refresh and zoom
document.addEventListener('touchmove', e => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });

let lastTap = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTap < 300) e.preventDefault();
  lastTap = now;
}, { passive: false });

init();
</script>
