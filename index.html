<!DOCTYPE html>

<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Desenha Comigo! 🎨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Bowlby+One&display=swap" rel="stylesheet">
<style>
  :root {
    --c-bg: #fff8e7;
    --c-ink: #2b1d0e;
    --c-primary: #ff5a36;
    --c-yellow: #ffd23f;
    --c-blue: #4ecdc4;
    --c-pink: #ff6b9d;
    --c-green: #95e06c;
    --c-purple: #a06cd5;
    --shadow: 4px 4px 0 #2b1d0e;
    --shadow-lg: 6px 6px 0 #2b1d0e;
  }

- { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
height: 100%;
overflow: hidden;
overscroll-behavior: none;
}

body {
font-family: ‘Fredoka’, system-ui, sans-serif;
background: #fff8e7;
color: #2b1d0e;
background-image:
radial-gradient(circle at 20% 30%, rgba(255,210,63,0.15) 0%, transparent 50%),
radial-gradient(circle at 80% 70%, rgba(78,205,196,0.15) 0%, transparent 50%);
user-select: none;
-webkit-user-select: none;
touch-action: manipulation;
}

/* Decorative paper texture */
body::before {
content: ‘’;
position: fixed;
inset: 0;
background-image:
repeating-linear-gradient(45deg, transparent 0 30px, rgba(43,29,14,0.015) 30px 31px);
pointer-events: none;
z-index: 0;
}

.screen {
position: fixed;
inset: 0;
display: none;
flex-direction: column;
padding: 16px;
z-index: 1;
overflow-y: auto;
-webkit-overflow-scrolling: touch;
}
.screen.active { display: flex; }

/* ============ HOME SCREEN ============ */
.home-header {
text-align: center;
padding: 12px 0 20px;
}
.home-title {
font-family: ‘Bowlby One’, sans-serif;
font-size: clamp(2.2rem, 9vw, 3.5rem);
color: #ff5a36;
line-height: 0.95;
text-shadow: 3px 3px 0 #2b1d0e;
letter-spacing: -1px;
transform: rotate(-2deg);
display: inline-block;
}
.home-subtitle {
font-size: clamp(0.95rem, 3.5vw, 1.1rem);
margin-top: 8px;
font-weight: 600;
color: #2b1d0e;
opacity: 0.75;
}
.home-emoji {
display: inline-block;
font-size: 1.4em;
animation: wiggle 2s ease-in-out infinite;
}
@keyframes wiggle {
0%, 100% { transform: rotate(-8deg); }
50% { transform: rotate(8deg); }
}

.drawings-grid {
display: grid;
grid-template-columns: repeat(2, 1fr);
gap: 14px;
max-width: 500px;
margin: 0 auto;
width: 100%;
padding-bottom: 24px;
}

.drawing-card {
background: white;
border: 3px solid #2b1d0e;
border-radius: 18px;
padding: 12px 8px 10px;
box-shadow: 4px 4px 0 #2b1d0e;
cursor: pointer;
transition: transform 0.15s, box-shadow 0.15s;
aspect-ratio: 1;
display: flex;
flex-direction: column;
align-items: center;
justify-content: space-between;
position: relative;
overflow: hidden;
}
.drawing-card:active {
transform: translate(2px, 2px);
box-shadow: 2px 2px 0 #2b1d0e;
}
.drawing-card:nth-child(1) { background: #fff3a8; }
.drawing-card:nth-child(2) { background: #b8eed5; }
.drawing-card:nth-child(3) { background: #ffd0e2; }
.drawing-card:nth-child(4) { background: #c5d9ff; }
.drawing-card:nth-child(5) { background: #ffd9b3; }
.drawing-card:nth-child(6) { background: #d6c1ff; }

.drawing-card svg {
width: 92%;
height: 78%;
flex: 1;
display: block;
}
.drawing-card-name {
font-family: ‘Bowlby One’, sans-serif;
font-size: clamp(0.95rem, 4vw, 1.15rem);
text-transform: lowercase;
margin-top: 4px;
}

/* ============ DRAW SCREEN ============ */
.draw-header {
display: flex;
align-items: center;
gap: 10px;
margin-bottom: 12px;
}

.btn-back {
width: 48px;
height: 48px;
border-radius: 50%;
background: white;
border: 3px solid #2b1d0e;
box-shadow: 4px 4px 0 #2b1d0e;
font-size: 1.5rem;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
flex-shrink: 0;
transition: transform 0.1s;
}
.btn-back:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #2b1d0e; }

.draw-title {
font-family: ‘Bowlby One’, sans-serif;
font-size: clamp(1.3rem, 5vw, 1.7rem);
color: #2b1d0e;
text-transform: lowercase;
flex: 1;
}

.progress-bar {
background: white;
border: 3px solid #2b1d0e;
border-radius: 14px;
height: 22px;
overflow: hidden;
margin-bottom: 12px;
position: relative;
}
.progress-fill {
height: 100%;
background: linear-gradient(90deg, #ff5a36, #ffd23f);
transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
border-right: 3px solid #2b1d0e;
}
.progress-text {
position: absolute;
inset: 0;
display: flex;
align-items: center;
justify-content: center;
font-weight: 700;
font-size: 0.85rem;
color: #2b1d0e;
}

.canvas-wrap {
background: white;
border: 3px solid #2b1d0e;
border-radius: 20px;
box-shadow: 6px 6px 0 #2b1d0e;
flex: 1;
min-height: 0;
display: flex;
align-items: center;
justify-content: center;
padding: 12px;
position: relative;
overflow: hidden;
}
.canvas-wrap::before {
content: ‘’;
position: absolute;
inset: 8px;
border: 2px dashed rgba(43,29,14,0.12);
border-radius: 14px;
pointer-events: none;
}
#stepSvg {
width: 100%;
height: 100%;
max-width: 100%;
max-height: 100%;
}

.instruction {
background: #ffd23f;
border: 3px solid #2b1d0e;
border-radius: 16px;
padding: 12px 16px;
margin: 14px 0;
font-weight: 600;
font-size: clamp(0.95rem, 3.8vw, 1.1rem);
text-align: center;
box-shadow: 4px 4px 0 #2b1d0e;
line-height: 1.3;
}

.nav-buttons {
display: flex;
gap: 10px;
}
.btn {
flex: 1;
border: 3px solid #2b1d0e;
border-radius: 16px;
padding: 16px 12px;
font-family: ‘Bowlby One’, sans-serif;
font-size: clamp(1rem, 4vw, 1.2rem);
cursor: pointer;
box-shadow: 4px 4px 0 #2b1d0e;
transition: transform 0.1s, box-shadow 0.1s;
text-transform: lowercase;
background: white;
}
.btn:active:not(:disabled) {
transform: translate(2px, 2px);
box-shadow: 2px 2px 0 #2b1d0e;
}
.btn:disabled { opacity: 0.35; cursor: not-allowed; }
.btn-primary { background: #ff5a36; color: white; }
.btn-secondary { background: white; }
.btn-success { background: #95e06c; }

/* ============ CAPTURE SCREEN ============ */
.capture-content {
flex: 1;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
gap: 18px;
text-align: center;
}
.capture-icon {
font-size: 5rem;
animation: bounce 1.5s ease-in-out infinite;
}
@keyframes bounce {
0%, 100% { transform: translateY(0); }
50% { transform: translateY(-10px); }
}
.capture-msg {
font-family: ‘Bowlby One’, sans-serif;
font-size: clamp(1.3rem, 5vw, 1.6rem);
color: #2b1d0e;
padding: 0 20px;
}
.capture-sub {
font-size: 1rem;
opacity: 0.7;
padding: 0 24px;
}
.capture-buttons {
display: flex;
flex-direction: column;
gap: 12px;
width: 100%;
max-width: 320px;
padding: 0 16px;
}

/* video preview */
#videoPreview {
width: 100%;
max-width: 420px;
border: 3px solid #2b1d0e;
border-radius: 18px;
background: black;
aspect-ratio: 4/3;
object-fit: cover;
box-shadow: 6px 6px 0 #2b1d0e;
}

/* ============ RESULT SCREEN ============ */
.result-stage {
flex: 1;
background: linear-gradient(180deg, #c5e8ff 0%, #95e06c 100%);
border: 3px solid #2b1d0e;
border-radius: 20px;
box-shadow: 6px 6px 0 #2b1d0e;
margin-bottom: 14px;
position: relative;
overflow: hidden;
min-height: 0;
transition: background 0.6s;
}
/* Per-drawing scene backgrounds */
.result-stage.scene-peixe   { background: linear-gradient(180deg, #4ecdc4 0%, #1a5f7a 100%); }
.result-stage.scene-gato    { background: linear-gradient(180deg, #ffe5a8 0%, #95e06c 100%); }
.result-stage.scene-casa    { background: linear-gradient(180deg, #c5e8ff 0%, #95e06c 100%); }
.result-stage.scene-milkshake { background: linear-gradient(180deg, #ffd0e2 0%, #ff6b9d 100%); }
.result-stage.scene-arco-iris { background: linear-gradient(180deg, #6a8caf 0%, #b5d8eb 100%); }
.result-stage.scene-foguete { background: linear-gradient(180deg, #0a0e3d 0%, #2d1b69 100%); }

/* Default clouds (only for casa/arco-iris scenes) */
.result-stage.scene-casa::after,
.result-stage.scene-arco-iris::after {
content: ‘’;
position: absolute;
top: 10%;
left: 0;
right: 0;
height: 40px;
background:
radial-gradient(ellipse 60px 25px at 20% 50%, white 40%, transparent 41%),
radial-gradient(ellipse 50px 22px at 70% 50%, white 40%, transparent 41%);
opacity: 0.85;
animation: clouds 20s linear infinite;
pointer-events: none;
}
@keyframes clouds {
from { transform: translateX(-30px); }
to { transform: translateX(30px); }
}

/* ===== Scene FX particles container ===== */
.scene-fx {
position: absolute;
inset: 0;
pointer-events: none;
z-index: 1;
overflow: hidden;
}
.scene-fx > * { position: absolute; }

/* ============================================================
SCENE PEIXE — underwater scene
============================================================ */
.bubble {
background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.9), rgba(255,255,255,0.3));
border-radius: 50%;
bottom: -30px;
animation: bubbleUp linear infinite;
opacity: 0.7;
}
@keyframes bubbleUp {
0%   { transform: translateY(0) translateX(0); opacity: 0; }
10%  { opacity: 0.8; }
90%  { opacity: 0.8; }
100% { transform: translateY(-110vh) translateX(20px); opacity: 0; }
}

/* Tiny background fish swimming across */
.mini-fish {
width: 40px;
height: 22px;
animation: miniSwim linear infinite;
}
.mini-fish svg { width: 100%; height: 100%; display: block; }
@keyframes miniSwim {
0%   { transform: translateX(-60px) scaleX(1); }
49%  { transform: translateX(calc(100vw + 60px)) scaleX(1); }
50%  { transform: translateX(calc(100vw + 60px)) scaleX(-1); }
99%  { transform: translateX(-60px) scaleX(-1); }
100% { transform: translateX(-60px) scaleX(1); }
}

/* Starfish (peixe) */
.starfish {
bottom: 5%;
width: 50px;
height: 50px;
animation: starfishPulse 2.5s ease-in-out infinite;
}
.starfish svg { width: 100%; height: 100%; }
@keyframes starfishPulse {
0%, 100% { transform: scale(1) rotate(0deg); }
50%      { transform: scale(1.1) rotate(8deg); }
}

/* Seaweed (peixe) */
.seaweed {
bottom: 0;
width: 30px;
height: 100px;
transform-origin: bottom center;
animation: seaweedSway ease-in-out infinite;
}
.seaweed svg { width: 100%; height: 100%; }
@keyframes seaweedSway {
0%, 100% { transform: rotate(-8deg); }
50%      { transform: rotate(8deg); }
}

/* Water caustic overlay on the picture (peixe) */
#resultImage.fx-water {
animation: swim 4s ease-in-out infinite, waterRipple 3s ease-in-out infinite;
}
@keyframes waterRipple {
0%, 100% { filter: drop-shadow(3px 3px 6px rgba(0,0,0,0.2)) hue-rotate(0deg) brightness(1); }
50%      { filter: drop-shadow(3px 3px 10px rgba(80,180,220,0.5)) hue-rotate(-8deg) brightness(1.08); }
}

/* ============================================================
SCENE GATO — sunny garden
============================================================ */
.dust {
width: 30px;
height: 14px;
background: radial-gradient(ellipse, rgba(255,240,200,0.8), transparent 70%);
border-radius: 50%;
bottom: 15%;
animation: dustPoof 1.2s ease-out infinite;
opacity: 0;
}
@keyframes dustPoof {
0%   { transform: translateX(-20px) scale(0.3); opacity: 0; }
40%  { opacity: 0.8; }
100% { transform: translateX(40px) scale(1.5); opacity: 0; }
}

/* Butterfly */
.butterfly {
width: 26px;
height: 22px;
animation: butterflyFly linear infinite;
}
.butterfly svg { width: 100%; height: 100%; }
@keyframes butterflyFly {
0%   { transform: translate(0, 0) rotate(-5deg); }
25%  { transform: translate(40vw, -30px) rotate(8deg); }
50%  { transform: translate(80vw, 20px) rotate(-5deg); }
75%  { transform: translate(40vw, 50px) rotate(8deg); }
100% { transform: translate(0, 0) rotate(-5deg); }
}

/* Grass tufts at bottom */
.grass {
bottom: 0;
width: 50px;
height: 30px;
transform-origin: bottom center;
animation: grassSway ease-in-out infinite;
}
.grass svg { width: 100%; height: 100%; }
@keyframes grassSway {
0%, 100% { transform: rotate(-4deg); }
50%      { transform: rotate(4deg); }
}

/* Sun-warmth glow on the picture */
#resultImage.fx-warmth {
animation: catBounce 1.2s ease-in-out infinite, warmGlow 2.5s ease-in-out infinite;
}
@keyframes warmGlow {
0%, 100% { filter: drop-shadow(3px 3px 6px rgba(0,0,0,0.2)) brightness(1); }
50%      { filter: drop-shadow(0 0 20px rgba(255,210,63,0.6)) brightness(1.06); }
}

/* ============================================================
SCENE CASA — countryside with sun, birds, flowers
============================================================ */
.smoke {
width: 18px;
height: 18px;
background: radial-gradient(circle, rgba(200,200,200,0.85), rgba(200,200,200,0.3) 70%, transparent);
border-radius: 50%;
animation: smokeRise 3s ease-out infinite;
opacity: 0;
}
@keyframes smokeRise {
0%   { transform: translateY(0) scale(0.4); opacity: 0; }
20%  { opacity: 0.8; }
100% { transform: translateY(-180px) scale(2.2) translateX(15px); opacity: 0; }
}

.sun {
top: 8%;
right: 8%;
width: 60px;
height: 60px;
background: radial-gradient(circle, #ffd23f 60%, #ff9933 100%);
border-radius: 50%;
box-shadow: 0 0 30px rgba(255,210,63,0.7);
animation: sunPulse 3s ease-in-out infinite;
}
@keyframes sunPulse {
0%, 100% { transform: scale(1); }
50%      { transform: scale(1.12); }
}

/* Birds */
.bird {
width: 28px;
height: 18px;
animation: birdFly linear infinite;
}
.bird svg { width: 100%; height: 100%; }
@keyframes birdFly {
0%   { transform: translateX(-40px) translateY(0); }
100% { transform: translateX(calc(100vw + 40px)) translateY(-20px); }
}
.bird svg .wing {
transform-origin: center;
animation: wingFlap 0.4s ease-in-out infinite alternate;
}
@keyframes wingFlap {
from { transform: scaleY(1); }
to   { transform: scaleY(0.3); }
}

/* Flowers at bottom */
.flower {
bottom: 3%;
width: 28px;
height: 40px;
animation: flowerSway 3s ease-in-out infinite;
transform-origin: bottom center;
}
.flower svg { width: 100%; height: 100%; }
@keyframes flowerSway {
0%, 100% { transform: rotate(-3deg); }
50%      { transform: rotate(3deg); }
}

/* ============================================================
SCENE MILKSHAKE — pink dream
============================================================ */
.spark {
width: 14px;
height: 14px;
background: radial-gradient(circle, #ffd23f 30%, transparent 31%);
animation: sparkPop 1.5s ease-in-out infinite;
opacity: 0;
}
@keyframes sparkPop {
0%, 100% { transform: scale(0); opacity: 0; }
50%      { transform: scale(1.4) rotate(180deg); opacity: 1; }
}

/* Floating hearts */
.heart {
width: 22px;
height: 22px;
animation: heartFloat linear infinite;
opacity: 0;
}
.heart svg { width: 100%; height: 100%; }
@keyframes heartFloat {
0%   { transform: translateY(0) scale(0.5); opacity: 0; }
10%  { opacity: 1; }
90%  { opacity: 1; }
100% { transform: translateY(-110vh) scale(1.2); opacity: 0; }
}

/* Falling cherries */
.cherry {
width: 16px;
height: 20px;
top: -20px;
animation: cherryFall linear infinite;
}
.cherry svg { width: 100%; height: 100%; }
@keyframes cherryFall {
0%   { transform: translateY(0) rotate(0deg); }
100% { transform: translateY(110vh) rotate(360deg); }
}

/* Shine overlay on milkshake picture */
#resultImage.fx-shine {
animation: milkshake 0.4s ease-in-out infinite, milkShine 3s linear infinite;
}
@keyframes milkShine {
0%, 100% { filter: drop-shadow(3px 3px 6px rgba(0,0,0,0.2)) brightness(1); }
50%      { filter: drop-shadow(0 0 16px rgba(255,200,230,0.7)) brightness(1.12) saturate(1.1); }
}

/* ============================================================
SCENE ARCO-IRIS — rainy then sunny
============================================================ */
.drop {
width: 3px;
height: 14px;
background: linear-gradient(180deg, rgba(255,255,255,0) 0%, #6cb4ee 100%);
border-radius: 2px;
top: -20px;
animation: rainFall linear infinite;
}
@keyframes rainFall {
from { transform: translateY(0); }
to   { transform: translateY(110vh); }
}

/* Lightning flash (subtle, occasional) */
.lightning-flash {
inset: 0;
background: rgba(255,255,200,0);
animation: flash 7s linear infinite;
z-index: 0;
}
@keyframes flash {
0%, 95%, 100% { background: rgba(255,255,200,0); }
96%           { background: rgba(255,255,200,0.4); }
97%           { background: rgba(255,255,200,0); }
98%           { background: rgba(255,255,200,0.3); }
}

/* Rainbow shimmer on picture */
#resultImage.fx-rainbow-shimmer {
animation: rainbowPulse 2s ease-in-out infinite, rainbowShimmer 4s linear infinite;
}
@keyframes rainbowShimmer {
0%   { filter: drop-shadow(3px 3px 6px rgba(0,0,0,0.2)) hue-rotate(0deg); }
100% { filter: drop-shadow(3px 3px 6px rgba(0,0,0,0.2)) hue-rotate(360deg); }
}

/* ============================================================
SCENE FOGUETE — outer space
============================================================ */
.star {
width: 4px;
height: 4px;
background: white;
border-radius: 50%;
box-shadow: 0 0 6px white;
animation: twinkle ease-in-out infinite;
}
@keyframes twinkle {
0%, 100% { opacity: 0.2; transform: scale(0.5); }
50%      { opacity: 1; transform: scale(1.3); }
}
.shooting-star {
width: 60px;
height: 2px;
background: linear-gradient(90deg, transparent, white);
top: 20%;
animation: shoot 4s linear infinite;
opacity: 0;
}
@keyframes shoot {
0%, 90% { opacity: 0; transform: translateX(-100px) translateY(0); }
95%     { opacity: 1; }
100%    { opacity: 0; transform: translateX(120vw) translateY(60px); }
}

/* Planet */
.planet {
width: 55px;
height: 55px;
border-radius: 50%;
animation: planetFloat 8s ease-in-out infinite;
}
.planet.p1 {
top: 12%; left: 8%;
background: radial-gradient(circle at 30% 30%, #ff9966, #cc5533);
box-shadow: inset -8px -8px 12px rgba(0,0,0,0.4);
}
.planet.p2 {
top: 60%; right: 6%;
width: 38px; height: 38px;
background: radial-gradient(circle at 30% 30%, #66d9ff, #2266aa);
box-shadow: inset -6px -6px 8px rgba(0,0,0,0.4);
}
@keyframes planetFloat {
0%, 100% { transform: translateY(0); }
50%      { transform: translateY(-15px); }
}

.flame {
bottom: 10%;
left: 50%;
width: 40px;
height: 80px;
background: radial-gradient(ellipse at 50% 0%, #ffd23f 0%, #ff5a36 50%, transparent 90%);
border-radius: 50% 50% 30% 30%;
transform: translateX(-50%);
animation: flameFlicker 0.15s ease-in-out infinite alternate;
z-index: 1;
}
@keyframes flameFlicker {
from { transform: translateX(-50%) scaleY(1) scaleX(1); opacity: 0.9; }
to   { transform: translateX(-50%) scaleY(1.2) scaleX(0.85); opacity: 1; }
}

/* Space glow on rocket pic */
#resultImage.fx-space-glow {
animation: rocketUp 3s ease-in-out infinite, spaceGlow 1.5s ease-in-out infinite;
}
@keyframes spaceGlow {
0%, 100% { filter: drop-shadow(3px 3px 6px rgba(0,0,0,0.4)) brightness(1); }
50%      { filter: drop-shadow(0 0 15px rgba(255,200,100,0.7)) brightness(1.1); }
}

#resultImage {
position: absolute;
max-width: 70%;
max-height: 70%;
left: 50%;
top: 50%;
transform: translate(-50%, -50%);
z-index: 2;
filter: drop-shadow(3px 3px 6px rgba(0,0,0,0.2));
}

/* Animations per type */
#resultImage.anim-swim {
animation: swim 4s ease-in-out infinite;
}
@keyframes swim {
0%   { transform: translate(-150%, -50%) rotate(-5deg); }
25%  { transform: translate(-50%, -60%) rotate(5deg); }
50%  { transform: translate(50%, -50%) rotate(-5deg) scaleX(-1); }
75%  { transform: translate(-50%, -40%) rotate(5deg) scaleX(-1); }
100% { transform: translate(-150%, -50%) rotate(-5deg); }
}

#resultImage.anim-bounce {
animation: catBounce 1.2s ease-in-out infinite;
transform-origin: center bottom;
}
@keyframes catBounce {
0%, 100% { transform: translate(-50%, -50%) scale(1, 1); }
50%      { transform: translate(-50%, -60%) scale(0.95, 1.05); }
}

#resultImage.anim-sway {
animation: housesway 3s ease-in-out infinite;
transform-origin: center bottom;
}
@keyframes housesway {
0%, 100% { transform: translate(-50%, -50%) rotate(-2deg); }
50%      { transform: translate(-50%, -50%) rotate(2deg); }
}

#resultImage.anim-shake {
animation: milkshake 0.4s ease-in-out infinite;
transform-origin: center center;
}
@keyframes milkshake {
0%, 100% { transform: translate(-50%, -50%) rotate(-3deg); }
25%      { transform: translate(-48%, -50%) rotate(3deg); }
75%      { transform: translate(-52%, -50%) rotate(-3deg); }
}

#resultImage.anim-rainbow {
animation: rainbowPulse 2s ease-in-out infinite;
}
@keyframes rainbowPulse {
0%, 100% { transform: translate(-50%, -50%) scale(1); filter: drop-shadow(3px 3px 6px rgba(0,0,0,0.2)) hue-rotate(0deg); }
50%      { transform: translate(-50%, -50%) scale(1.08); filter: drop-shadow(3px 3px 12px rgba(255,200,100,0.6)) hue-rotate(20deg); }
}

#resultImage.anim-rocket {
animation: rocketUp 3s ease-in-out infinite;
}
@keyframes rocketUp {
0%   { transform: translate(-50%, 150%) rotate(-3deg); }
50%  { transform: translate(-50%, -50%) rotate(3deg); }
100% { transform: translate(-50%, -150%) rotate(-3deg); opacity: 0; }
}

/* sparkles overlay for result */
.sparkle {
position: absolute;
width: 20px;
height: 20px;
background: radial-gradient(circle, #ffd23f 30%, transparent 31%);
animation: sparkle 1.5s ease-in-out infinite;
z-index: 3;
pointer-events: none;
}
@keyframes sparkle {
0%, 100% { opacity: 0; transform: scale(0.5); }
50% { opacity: 1; transform: scale(1.2); }
}

/* Confetti when finishing */
.confetti-piece {
position: fixed;
width: 12px;
height: 12px;
top: -20px;
z-index: 999;
pointer-events: none;
animation: confettiFall linear forwards;
}
@keyframes confettiFall {
to { transform: translateY(110vh) rotate(720deg); }
}

.result-actions {
display: flex;
gap: 10px;
}

/* Loading spinner */
.processing {
position: fixed;
inset: 0;
background: rgba(255,248,231,0.95);
display: none;
align-items: center;
justify-content: center;
z-index: 100;
flex-direction: column;
gap: 16px;
}
.processing.active { display: flex; }
.spinner {
width: 60px;
height: 60px;
border: 6px solid #ffd23f;
border-top-color: #ff5a36;
border-radius: 50%;
animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* Toast */
.toast {
position: fixed;
bottom: 30px;
left: 50%;
transform: translateX(-50%) translateY(150%);
background: #2b1d0e;
color: white;
padding: 14px 24px;
border-radius: 16px;
font-weight: 600;
z-index: 200;
transition: transform 0.3s;
text-align: center;
max-width: 90%;
}
.toast.show { transform: translateX(-50%) translateY(0); }

/* SVG step coloring */
.step-shape {
stroke: #2b1d0e;
stroke-width: 3;
stroke-linecap: round;
stroke-linejoin: round;
}
/* default fill is none unless an explicit fill attribute is set */
.step-shape:not([fill]) {
fill: none;
}
.step-shape.new {
animation: drawIn 0.8s ease-out;
}
@keyframes drawIn {
0% {
opacity: 0;
stroke: #ff5a36;
stroke-width: 6;
transform: scale(0.85);
transform-origin: center;
}
60% {
opacity: 1;
stroke: #ff5a36;
stroke-width: 5;
transform: scale(1.02);
}
100% {
opacity: 1;
stroke: #2b1d0e;
stroke-width: 3;
transform: scale(1);
}
}
.step-shape.fill-y { fill: #ffd23f; }
.step-shape.fill-p { fill: #ff6b9d; }
.step-shape.fill-b { fill: #4ecdc4; }
.step-shape.fill-g { fill: #95e06c; }
.step-shape.fill-w { fill: white; }
.step-shape.fill-r { fill: #ff5a36; }
.step-shape.fill-u { fill: #a06cd5; }
.step-shape.fill-brown { fill: #a0522d; }
</style>

</head>

<!-- ============ HOME SCREEN ============ -->

<div class="screen active" id="screenHome">

  <div class="drawings-grid" id="drawingsGrid"></div>
</div>

<!-- ============ DRAW SCREEN ============ -->

<div class="screen" id="screenDraw">

  </div>
  <div class="progress-bar">

  </div>
</div>

<!-- ============ CAPTURE SCREEN ============ -->

<div class="screen" id="screenCapture">
  <div class="draw-header">
    <button class="btn-back" onclick="backToDraw()">←</button>

  </div>

<div class="screen" id="screenCameraLive">

  <canvas id="captureCanvas" style="display:none"></canvas>
</div>

let cameraStream = null;

/* =====================================================================

   ===================================================================== */
// Custom viewBox per drawing for the menu preview, so each fits its card nicely
const PREVIEW_VIEWBOX = {
  peixe:       "20 110 380 200",
  gato:        "60 90 280 230",
  casa:        "70 20 330 360",
  milkshake:   "100 30 200 350",
  "arco-iris": "20 150 360 220",
  foguete:     "30 30 320 320"
};

function init() {
  const grid = document.getElementById('drawingsGrid');
  Object.keys(DRAWINGS).forEach(key => {
    const d = DRAWINGS[key];
    const card = document.createElement('div');
    card.className = 'drawing-card';
    card.onclick = () => startDrawing(key);
    const previewSvg = d.steps[d.steps.length - 1].join('');
    const vb = PREVIEW_VIEWBOX[key] || "0 0 400 400";
    card.innerHTML = `
      <svg viewBox="${vb}" preserveAspectRatio="xMidYMid meet">${previewSvg}</svg>
      <div class="drawing-card-name">${d.name}</div>
    `;
    grid.appendChild(card);
  });
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function goHome() {
  stopCamera();
  currentDrawing = null;
  currentStep = 0;
  showScreen('screenHome');
}

/* =====================================================================
   DRAW FLOW
   ===================================================================== */
function startDrawing(key) {
  currentDrawing = key;
  currentStep = 0;
  document.getElementById('drawTitle').textContent = DRAWINGS[key].name;
  renderStep();
  showScreen('screenDraw');
}

function renderStep() {
  const d = DRAWINGS[currentDrawing];
  const svg = document.getElementById('stepSvg');
  svg.innerHTML = d.steps[currentStep].join('');
  const total = d.steps.length;
  const pct = ((currentStep + 1) / total) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `passo ${currentStep + 1} de ${total}`;
  document.getElementById('instruction').textContent = d.instructions[currentStep] || '';

  document.getElementById('btnPrev').disabled = currentStep === 0;
  const btnNext = document.getElementById('btnNext');
  if (currentStep === total - 1) {
    btnNext.textContent = '📸 tirar foto!';
    btnNext.classList.remove('btn-primary');
    btnNext.classList.add('btn-success');
  } else {
    btnNext.textContent = 'próximo →';
    btnNext.classList.add('btn-primary');
    btnNext.classList.remove('btn-success');
  }
}

function nextStep() {
  const d = DRAWINGS[currentDrawing];
  if (currentStep < d.steps.length - 1) {
    currentStep++;
    renderStep();
  } else {
    // finished steps, go to capture
    fireConfetti();
    setTimeout(() => showScreen('screenCapture'), 600);
  }
}

function prevStep() {
  if (currentStep > 0) {
    currentStep--;
    renderStep();
  }
}

function backToDraw() {
  showScreen('screenDraw');
}

/* =====================================================================
   CAPTURE FLOW
   ===================================================================== */
async function openCamera() {
  // Try native getUserMedia first
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 960 } },
      audio: false
    });
    cameraStream = stream;
    const video = document.getElementById('videoPreview');
    video.srcObject = stream;
    showScreen('screenCameraLive');
  } catch (err) {
    console.warn('getUserMedia failed, falling back to capture input', err);
    // Fallback to native file input with capture attribute
    document.getElementById('cameraInput').click();
  }
}

function stopCamera() {
  if (cameraStream) {
    cameraStream.getTracks().forEach(t => t.stop());
    cameraStream = null;
  }
  showScreen('screenCapture');
}

function takePhoto() {
  const video = document.getElementById('videoPreview');
  const canvas = document.getElementById('captureCanvas');
  canvas.width = video.videoWidth || 1280;
  canvas.height = video.videoHeight || 960;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  const dataUrl = canvas.toDataURL('image/png');
  if (cameraStream) { cameraStream.getTracks().forEach(t => t.stop()); cameraStream = null; }
  processImage(dataUrl);
}

function openGallery() {
  document.getElementById('fileInput').click();
}

document.getElementById('fileInput').addEventListener('change', handleFile);
document.getElementById('cameraInput').addEventListener('change', handleFile);

function handleFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => processImage(ev.target.result);
  reader.readAsDataURL(file);
  e.target.value = ''; // reset so re-selecting same file works
}

/* =====================================================================
   IMAGE PROCESSING — remove white/light background
   ===================================================================== */
function processImage(dataUrl) {
  showProcessing(true);
  const img = new Image();
  img.onload = () => {
    try {
      const processed = removeBackground(img);
      capturedImageDataUrl = processed;
      showProcessing(false);
      showResult();
    } catch (err) {
      console.error(err);
      // fallback: use original
      capturedImageDataUrl = dataUrl;
      showProcessing(false);
      showResult();
      toast('não consegui tirar o fundo, mas tá tudo bem!');
    }
  };
  img.onerror = () => {
    showProcessing(false);
    toast('ops, não consegui ler a imagem');
  };
  img.src = dataUrl;
}

function removeBackground(img) {
  // Downscale large images for performance
  const MAX = 1000;
  let w = img.width, h = img.height;
  if (w > MAX || h > MAX) {
    const r = Math.min(MAX / w, MAX / h);
    w = Math.round(w * r);
    h = Math.round(h * r);
  }
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, w, h);
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  const N = w * h;

  // Step 1: Sample border pixels to estimate "paper color"
  // Take pixels from all 4 edges (avoiding corners which might be shadows)
  const samples = [];
  const border = 5; // skip outermost pixels
  for (let x = border; x < w - border; x += 4) {
    samples.push(getPixel(data, x, border, w));
    samples.push(getPixel(data, x, h - border - 1, w));
  }
  for (let y = border; y < h - border; y += 4) {
    samples.push(getPixel(data, border, y, w));
    samples.push(getPixel(data, w - border - 1, y, w));
  }
  // Median paper color (robust against outliers like a hand or shadow on edge)
  const paperR = median(samples.map(s => s[0]));
  const paperG = median(samples.map(s => s[1]));
  const paperB = median(samples.map(s => s[2]));

  // Step 2: Build a "is background" mask
  // A pixel is background if:
  //   (a) close in color to paper (Euclidean distance in RGB), OR
  //   (b) very bright AND very low saturation (white-ish)
  // Mask: 1 = background candidate, 0 = content
  const mask = new Uint8Array(N);
  for (let i = 0; i < N; i++) {
    const r = data[i*4], g = data[i*4+1], b = data[i*4+2];
    const dr = r - paperR, dg = g - paperG, db = b - paperB;
    const dist = Math.sqrt(dr*dr + dg*dg + db*db);
    const maxC = Math.max(r, g, b);
    const minC = Math.min(r, g, b);
    const lum = (r * 0.299 + g * 0.587 + b * 0.114);
    const sat = maxC === 0 ? 0 : (maxC - minC) / maxC;
    // Aggressive background detection:
    // - close to paper color (dist < 45), OR
    // - very bright (lum > 220) with low saturation (sat < 0.15)
    if (dist < 45 || (lum > 220 && sat < 0.15)) {
      mask[i] = 1;
    }
  }

  // Step 3: Flood-fill from all 4 borders.
  // Only background pixels CONNECTED to the border become transparent.
  // This preserves white interior regions (e.g., the cat's eye whites).
  const visited = new Uint8Array(N);
  const queue = [];
  // Seed from all border pixels marked as background
  for (let x = 0; x < w; x++) {
    if (mask[x] && !visited[x]) { queue.push(x); visited[x] = 1; }
    const bi = (h - 1) * w + x;
    if (mask[bi] && !visited[bi]) { queue.push(bi); visited[bi] = 1; }
  }
  for (let y = 0; y < h; y++) {
    const li = y * w;
    const ri = y * w + w - 1;
    if (mask[li] && !visited[li]) { queue.push(li); visited[li] = 1; }
    if (mask[ri] && !visited[ri]) { queue.push(ri); visited[ri] = 1; }
  }
  // BFS flood fill
  let head = 0;
  while (head < queue.length) {
    const idx = queue[head++];
    const x = idx % w;
    const y = (idx - x) / w;
    // 4-neighbors
    const neighbors = [];
    if (x > 0) neighbors.push(idx - 1);
    if (x < w - 1) neighbors.push(idx + 1);
    if (y > 0) neighbors.push(idx - w);
    if (y < h - 1) neighbors.push(idx + w);
    for (const n of neighbors) {
      if (!visited[n] && mask[n]) {
        visited[n] = 1;
        queue.push(n);
      }
    }
  }

  // Step 4: Apply mask. visited[i] == 1 means "background reachable from edge" → transparent.
  // For natural anti-aliased edges, soften transition: pixels close to paper color get partial alpha.
  for (let i = 0; i < N; i++) {
    if (visited[i]) {
      data[i*4 + 3] = 0;
    } else {
      // Content pixel — keep, but if it's still slightly paper-ish (near boundary), soften alpha
      const r = data[i*4], g = data[i*4+1], b = data[i*4+2];
      const dr = r - paperR, dg = g - paperG, db = b - paperB;
      const dist = Math.sqrt(dr*dr + dg*dg + db*db);
      if (dist < 60) {
        // soft transition zone
        const alpha = Math.min(255, ((dist - 45) / 15) * 255);
        data[i*4 + 3] = Math.max(0, alpha);
      }
    }
  }
  ctx.putImageData(imgData, 0, 0);

  // Step 5: Crop to content
  return cropToContent(canvas);
}

function getPixel(data, x, y, w) {
  const i = (y * w + x) * 4;
  return [data[i], data[i+1], data[i+2]];
}

function median(arr) {
  const s = arr.slice().sort((a, b) => a - b);
  return s[Math.floor(s.length / 2)];
}

function cropToContent(canvas) {
  const ctx = canvas.getContext('2d');
  const { width: w, height: h } = canvas;
  const data = ctx.getImageData(0, 0, w, h).data;
  let minX = w, minY = h, maxX = 0, maxY = 0;
  let found = false;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const alpha = data[(y * w + x) * 4 + 3];
      if (alpha > 20) {
        if (x < minX) minX = x;
        if (y < minY) minY = y;
        if (x > maxX) maxX = x;
        if (y > maxY) maxY = y;
        found = true;
      }
    }
  }
  if (!found) return canvas.toDataURL('image/png');
  const padding = 10;
  minX = Math.max(0, minX - padding);
  minY = Math.max(0, minY - padding);
  maxX = Math.min(w - 1, maxX + padding);
  maxY = Math.min(h - 1, maxY + padding);
  const cw = maxX - minX + 1;
  const ch = maxY - minY + 1;
  const out = document.createElement('canvas');
  out.width = cw; out.height = ch;
  out.getContext('2d').drawImage(canvas, minX, minY, cw, ch, 0, 0, cw, ch);
  return out.toDataURL('image/png');
}

function showResult() {
  const d = DRAWINGS[currentDrawing];
  const img = document.getElementById('resultImage');
  const stage = document.getElementById('resultStage');
  const fx = document.getElementById('sceneFx');

  img.src = capturedImageDataUrl;
  img.className = '';
  void img.offsetWidth;
  // Each drawing has its base animation + a scene-specific filter effect on the photo
  const fxClass = {
    peixe: 'fx-water',
    gato: 'fx-warmth',
    casa: '',
    milkshake: 'fx-shine',
    'arco-iris': 'fx-rainbow-shimmer',
    foguete: 'fx-space-glow'
  }[currentDrawing];
  if (fxClass) {
    img.classList.add(fxClass);
  } else {
    img.classList.add(d.anim);
  }

  // Apply scene background
  stage.className = 'result-stage scene-' + currentDrawing;

  // Build scene FX particles for this drawing
  fx.innerHTML = '';
  buildSceneFX(currentDrawing, fx);

  document.getElementById('resultTitle').textContent = `seu ${d.name}!`;
  showScreen('screenResult');
  fireConfetti();
}

function el(tag, className, html) {
  const e = document.createElement(tag);
  if (className) e.className = className;
  if (html) e.innerHTML = html;
  return e;
}

function buildSceneFX(key, container) {
  switch (key) {
    case 'peixe': {
      // 18 bubbles, varied sizes
      for (let i = 0; i < 18; i++) {
        const b = el('div', 'bubble');
        const size = 8 + Math.random() * 28;
        b.style.width = size + 'px';
        b.style.height = size + 'px';
        b.style.left = Math.random() * 95 + '%';
        b.style.animationDuration = (4 + Math.random() * 6) + 's';
        b.style.animationDelay = (Math.random() * 6) + 's';
        container.appendChild(b);
      }
      // 3 mini fish at different depths
      const fishVariants = [SVG.miniFishOrange, SVG.miniFishPink, SVG.miniFishYellow];
      for (let i = 0; i < 3; i++) {
        const f = el('div', 'mini-fish', fishVariants[i]);
        f.style.top = (20 + i * 22 + Math.random() * 10) + '%';
        f.style.animationDuration = (12 + i * 4) + 's';
        f.style.animationDelay = (-i * 4) + 's';
        f.style.opacity = 0.85 - i * 0.15;
        container.appendChild(f);
      }
      // 2 starfish at bottom corners
      const s1 = el('div', 'starfish', SVG.starfish);
      s1.style.left = '5%';
      container.appendChild(s1);
      const s2 = el('div', 'starfish', SVG.starfish);
      s2.style.right = '8%';
      s2.style.transform = 'scale(0.8)';
      s2.style.animationDelay = '-1s';
      container.appendChild(s2);
      // Seaweeds along bottom
      const positions = [8, 28, 72, 88];
      positions.forEach((pos, i) => {
        const sw = el('div', 'seaweed', SVG.seaweed);
        sw.style.left = pos + '%';
        sw.style.animationDuration = (3 + Math.random() * 2) + 's';
        sw.style.animationDelay = (-Math.random() * 3) + 's';
        sw.style.height = (80 + Math.random() * 40) + 'px';
        container.appendChild(sw);
      });
      break;
    }

    case 'gato': {
      // Sun
      const sun = el('div', 'sun');
      sun.style.width = '55px';
      sun.style.height = '55px';
      container.appendChild(sun);
      // Dust puffs
      for (let i = 0; i < 4; i++) {
        const d = el('div', 'dust');
        d.style.left = (35 + Math.random() * 30) + '%';
        d.style.animationDelay = (i * 0.3) + 's';
        container.appendChild(d);
      }
      // Butterflies
      for (let i = 0; i < 2; i++) {
        const b = el('div', 'butterfly', SVG.butterfly);
        b.style.top = (15 + i * 30) + '%';
        b.style.left = '0%';
        b.style.animationDuration = (12 + i * 4) + 's';
        b.style.animationDelay = (-i * 6) + 's';
        container.appendChild(b);
      }
      // Grass at bottom
      [5, 30, 65, 90].forEach((pos, i) => {
        const g = el('div', 'grass', SVG.grass);
        g.style.left = pos + '%';
        g.style.animationDuration = (2.5 + Math.random()) + 's';
        g.style.animationDelay = (-Math.random() * 2) + 's';
        container.appendChild(g);
      });
      break;
    }

    case 'casa': {
      // Sun
      container.appendChild(el('div', 'sun'));
      // Smoke from chimney
      for (let i = 0; i < 6; i++) {
        const s = el('div', 'smoke');
        s.style.left = (48 + Math.random() * 8) + '%';
        s.style.top = '40%';
        s.style.animationDelay = (i * 0.5) + 's';
        container.appendChild(s);
      }
      // Birds flying across
      for (let i = 0; i < 2; i++) {
        const b = el('div', 'bird', SVG.bird);
        b.style.top = (20 + i * 15) + '%';
        b.style.left = '0%';
        b.style.animationDuration = (10 + i * 3) + 's';
        b.style.animationDelay = (-i * 5) + 's';
        container.appendChild(b);
      }
      // Flowers along bottom
      const flowerPositions = [[8, SVG.flowerPink], [22, SVG.flowerYellow], [78, SVG.flowerYellow], [90, SVG.flowerPink]];
      flowerPositions.forEach(([pos, svg], i) => {
        const f = el('div', 'flower', svg);
        f.style.left = pos + '%';
        f.style.animationDelay = (-i * 0.5) + 's';
        container.appendChild(f);
      });
      break;
    }

    case 'milkshake': {
      // Sparkles
      for (let i = 0; i < 16; i++) {
        const s = el('div', 'spark');
        s.style.left = (8 + Math.random() * 84) + '%';
        s.style.top = (10 + Math.random() * 80) + '%';
        s.style.animationDelay = (Math.random() * 1.5) + 's';
        const scale = 0.6 + Math.random();
        s.style.transform = `scale(${scale})`;
        container.appendChild(s);
      }
      // Floating hearts
      for (let i = 0; i < 8; i++) {
        const h = el('div', 'heart', SVG.heart);
        h.style.left = (5 + Math.random() * 90) + '%';
        h.style.bottom = '-30px';
        h.style.animationDuration = (6 + Math.random() * 4) + 's';
        h.style.animationDelay = (Math.random() * 6) + 's';
        container.appendChild(h);
      }
      // Falling cherries
      for (let i = 0; i < 5; i++) {
        const c = el('div', 'cherry', SVG.cherry);
        c.style.left = Math.random() * 95 + '%';
        c.style.animationDuration = (4 + Math.random() * 3) + 's';
        c.style.animationDelay = (Math.random() * 4) + 's';
        container.appendChild(c);
      }
      break;
    }

    case 'arco-iris': {
      // Lightning flash (subtle, occasional)
      container.appendChild(el('div', 'lightning-flash'));
      // Rain
      for (let i = 0; i < 35; i++) {
        const d = el('div', 'drop');
        d.style.left = Math.random() * 100 + '%';
        d.style.animationDuration = (1.2 + Math.random() * 1.5) + 's';
        d.style.animationDelay = (Math.random() * 2) + 's';
        container.appendChild(d);
      }
      break;
    }

    case 'foguete': {
      // Starfield
      for (let i = 0; i < 50; i++) {
        const s = el('div', 'star');
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        s.style.animationDuration = (1 + Math.random() * 2) + 's';
        s.style.animationDelay = (Math.random() * 2) + 's';
        container.appendChild(s);
      }
      // Planets
      container.appendChild(el('div', 'planet p1'));
      container.appendChild(el('div', 'planet p2'));
      // Shooting stars
      for (let i = 0; i < 3; i++) {
        const ss = el('div', 'shooting-star');
        ss.style.top = (8 + Math.random() * 50) + '%';
        ss.style.animationDelay = (i * 2.5 + Math.random()) + 's';
        ss.style.animationDuration = (3 + Math.random() * 2) + 's';
        container.appendChild(ss);
      }
      // Flame trail
      container.appendChild(el('div', 'flame'));
      break;
    }
  }
}

function downloadResult() {
  if (!capturedImageDataUrl) return;
  const a = document.createElement('a');
  a.href = capturedImageDataUrl;
  a.download = `meu-${DRAWINGS[currentDrawing].name}.png`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  toast('foto salva! 🎉');
}

/* =====================================================================
   UTILITIES
   ===================================================================== */
function showProcessing(on) {
  document.getElementById('processing').classList.toggle('active', on);
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2400);
}

function fireConfetti() {
  const colors = ['#ff5a36', '#ffd23f', '#4ecdc4', '#ff6b9d', '#95e06c', '#a06cd5'];
  for (let i = 0; i < 40; i++) {
    const piece = document.createElement('div');
    piece.className = 'confetti-piece';
    piece.style.left = Math.random() * 100 + '%';
    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
    piece.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
    piece.style.animationDelay = Math.random() * 0.5 + 's';
    if (Math.random() > 0.5) piece.style.borderRadius = '50%';
    piece.style.transform = `rotate(${Math.random() * 360}deg)`;
    document.body.appendChild(piece);
    setTimeout(() => piece.remove(), 3500);
  }
}

// Prevent pull-to-refresh and zoom
document.addEventListener('touchmove', e => {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });

let lastTap = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTap < 300) e.preventDefault();
  lastTap = now;
}, { passive: false });

init();
</script>
